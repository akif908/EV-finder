$kind: http-request
url: "{{baseUrl}}/api/bookings"
method: POST
headers:
  Authorization: Bearer {{userToken}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "vehicleId": "{{vehicleId}}",
      "serviceId": "does-not-exist",
      "startTime": "{{slotDate}}T08:00:00",
      "endTime": "{{slotDate}}T09:00:00"
    }
scripts:
  - type: afterResponse
    code: pm.test('TC-19 status is 404', () => pm.response.to.have.status(404));
    language: text/javascript
order: 4000
