$kind: http-request
url: "{{baseUrl}}/api/services/{{serviceId}}/slots?date={{slotDate}}"
method: GET
headers:
  Authorization: Bearer {{userToken}}
  Content-Type: application/json
queryParams:
  date: "{{slotDate}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('TC-15 status is 200', () => pm.response.to.have.status(200));
      pm.test('slot grid non-empty', () => pm.expect(pm.response.json().length).to.be.above(0));
    language: text/javascript
order: 5000
