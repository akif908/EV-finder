$kind: http-request
url: "{{baseUrl}}/api/reviews/station/{{stationId}}"
method: GET
headers:
  Authorization: Bearer {{userToken}}
  Content-Type: application/json
scripts:
  - type: afterResponse
    code: pm.test('TC-29 status is 200', () => pm.response.to.have.status(200));
    language: text/javascript
order: 1000
