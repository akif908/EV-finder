$kind: http-request
name: TC-07 PUT /api/vehicles/{id} (200)
description: |-
  Expected 200 OK with the updated model.

  Keeps the same registration number, which the service explicitly allows for an update of the same vehicle. Requires TC-06 to have run (it saves createdVehicleId).
url: "{{baseUrl}}/api/vehicles/{{createdVehicleId}}"
method: PUT
headers:
  Authorization: Bearer {{userToken}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "manufacturer": "Test",
      "model": "Acceptance Car v2",
      "vehicleType": "ELECTRIC_CAR",
      "connectorType": "CCS2",
      "batteryCapacityKwh": 64,
      "registrationNo": "{{testRegNo}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('TC-07 status is 200', () => pm.response.to.have.status(200));
      pm.test('model was updated', () => pm.expect(pm.response.json().model).to.eql('Acceptance Car v2'));
    language: text/javascript
order: 2000
