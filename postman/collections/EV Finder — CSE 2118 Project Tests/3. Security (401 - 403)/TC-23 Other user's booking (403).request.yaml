$kind: http-request
description: |-
  Expected 403 Forbidden: the operator is authenticated but does not own this booking.

  Self-contained — if no bookingId is stored, the pre-request script picks one of the user's existing bookings. Ownership is checked before status, so this returns 403 even for a cancelled booking. Needs the user and operator tokens from folder 1.
url: "{{baseUrl}}/api/bookings/{{bookingId}}"
method: GET
headers:
  Authorization: Bearer {{operatorToken}}
  Content-Type: application/json
scripts:
  - type: beforeRequest
    code: |-
      // TC-23 needs a booking owned by the USER, not the operator.
      // If none is stored yet, take the user's most recent booking so the request
      // also works when run straight after the logins.
      const base = pm.collectionVariables.get('baseUrl');
      if (!pm.collectionVariables.get('bookingId')) {
          pm.sendRequest({
              url: base + '/api/bookings/my',
              method: 'GET',
              header: { 'Authorization': 'Bearer ' + pm.collectionVariables.get('userToken') }
          }, (err, res) => {
              const list = res && res.json ? res.json() : [];
              if (Array.isArray(list) && list.length) {
                  pm.collectionVariables.set('bookingId', list[0].id);
                  console.log('TC-23: using booking ' + list[0].id + ' owned by the user');
              } else {
                  console.log('TC-23: no bookings found — run folder 6, TC-16 first');
              }
          });
      }
    language: text/javascript
  - type: afterResponse
    code: pm.test('TC-23 status is 403', () => pm.response.to.have.status(403));
    language: text/javascript
order: 5000
