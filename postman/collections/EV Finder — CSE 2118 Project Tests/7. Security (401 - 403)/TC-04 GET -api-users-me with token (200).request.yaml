$kind: http-request
name: TC-04 GET /api/users/me with token (200)
url: "{{baseUrl}}/api/users/me"
method: GET
headers:
  Authorization: Bearer {{userToken}}
  Content-Type: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test('TC-04 status is 200', () => pm.response.to.have.status(200));
      pm.test('email matches', () => pm.expect(pm.response.json().email).to.eql('test@ev.com'));
    language: text/javascript
order: 2000
