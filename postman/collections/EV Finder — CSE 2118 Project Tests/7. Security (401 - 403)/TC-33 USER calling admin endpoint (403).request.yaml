$kind: http-request
url: "{{baseUrl}}/api/admin/overview"
method: GET
headers:
  Authorization: Bearer {{userToken}}
  Content-Type: application/json
scripts:
  - type: afterResponse
    code: pm.test('TC-33 status is 403', () => pm.response.to.have.status(403));
    language: text/javascript
order: 3000
