$kind: http-request
url: "{{baseUrl}}/api/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "name": "",
      "email": "not-an-email",
      "password": "123"
    }
scripts:
  - type: afterResponse
    code: pm.test('TC-05 status is 400', () => pm.response.to.have.status(400));
    language: text/javascript
order: 5000
