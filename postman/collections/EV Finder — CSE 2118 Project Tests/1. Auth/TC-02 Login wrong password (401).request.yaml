$kind: http-request
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "test@ev.com",
      "password": "wrong-password"
    }
scripts:
  - type: afterResponse
    code: pm.test('TC-02 status is 401', () => pm.response.to.have.status(401));
    language: text/javascript
order: 4000
