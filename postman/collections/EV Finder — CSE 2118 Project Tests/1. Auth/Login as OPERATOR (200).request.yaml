$kind: http-request
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "operator@ev.com",
      "password": "operator123"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200));
      pm.collectionVariables.set('operatorToken', pm.response.json().token);
    language: text/javascript
order: 2000
