$kind: http-request
url: "{{baseUrl}}/api/stations/does-not-exist"
method: GET
headers:
  Authorization: Bearer {{userToken}}
  Content-Type: application/json
scripts:
  - type: afterResponse
    code: pm.test('TC-13 status is 404', () => pm.response.to.have.status(404));
    language: text/javascript
order: 3000
