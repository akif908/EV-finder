$kind: http-request
name: TC-11 GET /api/stations (200, rating ranked)
url: "{{baseUrl}}/api/stations"
method: GET
headers:
  Authorization: Bearer {{userToken}}
  Content-Type: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test('TC-11 status is 200', () => pm.response.to.have.status(200));
      pm.test('non-empty list', () => pm.expect(pm.response.json().length).to.be.above(0));
    language: text/javascript
order: 1000
