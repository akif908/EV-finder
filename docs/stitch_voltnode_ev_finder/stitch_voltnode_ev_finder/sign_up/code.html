<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/></head><body class="bg-background font-body-md text-on-background"><main class="w-full min-h-screen flex items-center justify-center p-gutter"><div class="flex flex-col w-full h-full min-h-[calc(100vh-64px)] justify-center">
<div class="grid grid-cols-12 gap-gutter w-full max-w-container-max mx-auto h-full min-h-[800px] bg-surface-dim rounded-2xl overflow-hidden shadow-2xl relative">
<!-- Decorative Ambient Background -->
<div class="absolute inset-0 pointer-events-none overflow-hidden z-0">
<div class="absolute -top-[20%] -left-[10%] w-[50%] h-[50%] bg-primary/10 blur-[120px] rounded-full mix-blend-screen"></div>
<div class="absolute top-[40%] -right-[20%] w-[60%] h-[60%] bg-secondary-container/10 blur-[150px] rounded-full mix-blend-screen"></div>
</div>
<!-- Image / Brand Side -->
<div class="col-span-12 lg:col-span-5 relative hidden lg:flex flex-col justify-between p-12 overflow-hidden bg-surface z-10" data-alt="A sleek, high-end electric vehicle charging at a futuristic, minimalist charging station at night. Volumetric lighting in neon electric green cuts through subtle mist. The vehicle is a dark metallic charcoal with sharp, aerodynamic lines. The environment feels high-tech, fast, and engineered for performance. Deep shadows and high contrast, evoking a sense of corporate modernism and sustainable power." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBWsEkuWaIasM7_qocqGaocYs-VDGdEd0gCecKi1JCDnaJ1I-5HFxuglIqilFN50C16NmnEgLMmaWJjW9vkrVgBcSgSvhGvHCUumDXzpCpZR4hT8BOfs8wZESKapAHQ5-JyciMBfc4zPuLwIZ75rUbFekBiQtthkJvId9TAh4AZ1WMFEcT84_D5Q7eOjed62rlB5a2OyMPe_nKOvs8XY-XtM3ZlOmvRsN8URIcNiujaz9KLdyPHyCH1')">
<div class="absolute inset-0 bg-gradient-to-b from-surface-dim/80 via-transparent to-surface-dim/90 z-0"></div>
<div class="relative z-10">
<span class="material-symbols-outlined text-primary text-[48px] drop-shadow-[0_0_12px_rgba(75,226,119,0.4)]">bolt</span>
</div>
<div class="relative z-10 flex flex-col gap-6">
<h2 class="font-headline-lg text-headline-lg text-on-surface">Powering the<br/>Electric Transition.</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-sm">Join the network engineered for high-performance mobility and seamless energy management.</p>
<div class="flex items-center gap-4 mt-8">
<div class="w-12 h-1 bg-primary rounded-full drop-shadow-[0_0_8px_rgba(75,226,119,0.5)]"></div>
<div class="w-2 h-1 bg-surface-variant rounded-full"></div>
<div class="w-2 h-1 bg-surface-variant rounded-full"></div>
</div>
</div>
</div>
<!-- Form Side -->
<div class="col-span-12 lg:col-span-7 flex items-center justify-center p-8 lg:p-16 relative z-10 bg-surface-dim">
<div class="w-full max-w-[480px] bg-surface-container-low p-8 lg:p-10 rounded-xl shadow-lg border border-surface-variant relative overflow-hidden group">
<!-- Subtle Form Highlight on Hover -->
<div class="absolute -inset-px bg-gradient-to-br from-primary/5 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-500 rounded-xl pointer-events-none"></div>
<div class="mb-10 text-center relative z-10">
<h1 class="font-headline-md text-headline-md text-on-surface mb-2 tracking-tight">Create Account</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Initialize your secure access portal.</p>
</div>
<!-- Account Type Toggle -->
<div aria-label="Account Type" class="flex p-1 bg-surface rounded-lg mb-8 relative z-10 border border-surface-variant shadow-inner" role="group">
<button class="flex-1 py-3 px-4 rounded-md font-label-md text-label-md transition-all duration-300 bg-surface-container text-on-surface shadow-sm border border-surface-variant" id="toggle-driver" onclick="switchTab('driver')" type="button">
                    Driver
                </button>
<button class="flex-1 py-3 px-4 rounded-md font-label-md text-label-md transition-all duration-300 text-on-surface-variant hover:text-on-surface hover:bg-surface-container/50 border border-transparent" id="toggle-operator" onclick="switchTab('operator')" type="button">
                    Station Operator
                </button>
</div>
<form class="flex flex-col gap-5 relative z-10" onsubmit="event.preventDefault();">
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider" for="fullName">Full Name</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-on-surface-variant/70">person</span>
<input class="w-full bg-surface-container border border-surface-variant rounded-lg py-3 pl-12 pr-4 font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all duration-200" id="fullName" placeholder="Jane Doe" type="text"/>
</div>
</div>
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider" for="email">Email Address</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-on-surface-variant/70">mail</span>
<input class="w-full bg-surface-container border border-surface-variant rounded-lg py-3 pl-12 pr-4 font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all duration-200" id="email" placeholder="jane@example.com" type="email"/>
</div>
</div>
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider" for="password">Password</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-on-surface-variant/70">lock</span>
<input class="w-full bg-surface-container border border-surface-variant rounded-lg py-3 pl-12 pr-12 font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all duration-200" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-4 text-on-surface-variant/70 hover:text-primary transition-colors focus:outline-none" onclick="togglePassword('password', 'visibility_icon_1')" type="button">
<span class="material-symbols-outlined" id="visibility_icon_1">visibility</span>
</button>
</div>
</div>
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider" for="confirmPassword">Confirm Password</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-on-surface-variant/70">swipe_left_alt</span>
<input class="w-full bg-surface-container border border-surface-variant rounded-lg py-3 pl-12 pr-12 font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all duration-200" id="confirmPassword" placeholder="••••••••" type="password"/>
<button class="absolute right-4 text-on-surface-variant/70 hover:text-primary transition-colors focus:outline-none" onclick="togglePassword('confirmPassword', 'visibility_icon_2')" type="button">
<span class="material-symbols-outlined" id="visibility_icon_2">visibility</span>
</button>
</div>
</div>
<!-- Operator Specific Fields (Hidden by default) -->
<div class="hidden flex-col gap-5 overflow-hidden transition-all duration-300 opacity-0 -translate-y-4" id="operator-fields">
<div class="flex flex-col gap-2">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider" for="companyName">Company Name</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-on-surface-variant/70">business</span>
<input class="w-full bg-surface-container border border-surface-variant rounded-lg py-3 pl-12 pr-4 font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all duration-200" id="companyName" placeholder="Volt Networks Inc." type="text"/>
</div>
</div>
</div>
<div class="flex items-start gap-3 mt-2">
<div class="relative flex items-center justify-center h-6 w-6 shrink-0 mt-0.5">
<input class="appearance-none w-5 h-5 bg-surface-container border border-surface-variant rounded focus:outline-none focus:ring-2 focus:ring-primary/20 checked:bg-primary checked:border-primary transition-colors cursor-pointer peer" id="terms" type="checkbox"/>
<span class="material-symbols-outlined absolute text-[16px] text-on-primary opacity-0 peer-checked:opacity-100 pointer-events-none transition-opacity" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
<label class="font-body-md text-[14px] leading-[20px] text-on-surface-variant cursor-pointer" for="terms">
                        I agree to the <a class="text-primary hover:text-primary-fixed-dim transition-colors underline decoration-primary/30 underline-offset-4" href="#">Terms of Service</a> and <a class="text-primary hover:text-primary-fixed-dim transition-colors underline decoration-primary/30 underline-offset-4" href="#">Privacy Policy</a>.
                    </label>
</div>
<button class="w-full mt-4 bg-primary text-on-primary py-4 rounded-lg font-label-md text-label-md uppercase tracking-widest hover:bg-primary-fixed hover:shadow-[0_0_20px_rgba(34,197,94,0.3)] transition-all duration-300 transform hover:-translate-y-0.5 active:translate-y-0 focus:outline-none focus:ring-4 focus:ring-primary/20 flex items-center justify-center gap-2 group" type="submit">
<span>Initialize Account</span>
<span class="material-symbols-outlined text-[20px] group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</form>
<div class="mt-8 text-center relative z-10">
<p class="font-body-md text-body-md text-on-surface-variant">
                    Already operational? 
                    <a class="font-label-md text-label-md text-primary hover:text-primary-fixed-dim transition-colors ml-1 border-b border-primary/30 hover:border-primary pb-0.5" href="#">Authenticate</a>
</p>
</div>
</div>
</div>
</div>
</div>
<script>
    function togglePassword(inputId, iconId) {
        const input = document.getElementById(inputId);
        const icon = document.getElementById(iconId);
        
        if (input.type === 'password') {
            input.type = 'text';
            icon.textContent = 'visibility_off';
        } else {
            input.type = 'password';
            icon.textContent = 'visibility';
        }
    }

    function switchTab(type) {
        const driverBtn = document.getElementById('toggle-driver');
        const operatorBtn = document.getElementById('toggle-operator');
        const operatorFields = document.getElementById('operator-fields');
        
        const activeClasses = ['bg-surface-container', 'text-on-surface', 'shadow-sm', 'border-surface-variant'];
        const inactiveClasses = ['text-on-surface-variant', 'border-transparent', 'hover:text-on-surface', 'hover:bg-surface-container/50'];

        if (type === 'driver') {
            driverBtn.classList.add(...activeClasses);
            driverBtn.classList.remove(...inactiveClasses);
            
            operatorBtn.classList.remove(...activeClasses);
            operatorBtn.classList.add(...inactiveClasses);
            
            operatorFields.classList.add('hidden', 'opacity-0', '-translate-y-4');
            operatorFields.classList.remove('flex', 'opacity-100', 'translate-y-0');
        } else {
            operatorBtn.classList.add(...activeClasses);
            operatorBtn.classList.remove(...inactiveClasses);
            
            driverBtn.classList.remove(...activeClasses);
            driverBtn.classList.add(...inactiveClasses);
            
            operatorFields.classList.remove('hidden');
            // Small delay to allow display:flex to apply before animating opacity
            setTimeout(() => {
                operatorFields.classList.add('flex', 'opacity-100', 'translate-y-0');
                operatorFields.classList.remove('opacity-0', '-translate-y-4');
            }, 10);
        }
    }
</script></main></body></html>
