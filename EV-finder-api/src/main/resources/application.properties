spring.application.name=EV-finder-api

# ------------------------------------------------------------
# Server
# ------------------------------------------------------------
server.port=8080

# ------------------------------------------------------------
# MySQL (XAMPP) - create the DB first:  source D:/EV finder/schema.sql
# ------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/ev_finder?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ------------------------------------------------------------
# JPA / Hibernate
# ddl-auto=update while developing; switch to "validate" and
# manage schema via schema.sql once entities are stable.
# ------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ------------------------------------------------------------
# JWT (Phase 2) - replace secret with a long random value in
# application-local.properties; do not commit real secrets.
# ------------------------------------------------------------
app.jwt.secret=change-me-to-a-random-base64-secret-at-least-32-bytes-long
app.jwt.expiration-ms=86400000
